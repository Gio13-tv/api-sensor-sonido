<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONIDOFlop Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight text-cyan-400">SONIDO<span class="text-white">Flop</span></h1>
            <span id="estadoConexion" class="bg-amber-500/10 text-amber-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-amber-500/20">Conectando...</span>
        </header>

        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-slate-300">Deteccion de ruido en tiempo real</h2>
            <div class="h-64">
                <canvas id="graficaLive"></canvas>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-4">
                <h3 class="text-lg font-medium text-slate-200">Panel de Control</h3>
                <p class="text-sm text-slate-400">Gestiona el flujo de datos en tiempo real.</p>
                <button onclick="activarFlujoVivo()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer">
                    Reiniciar Flujo Vivo
                </button>
                <button onclick="filtrarAlertas()" class="w-full bg-red-950 hover:bg-red-900 text-red-200 font-medium py-2 px-4 rounded-lg border border-red-800/50 transition cursor-pointer">
                    Ver Alertas Críticas
                </button>
            </div>

            <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 id="tituloTabla" class="text-lg font-medium text-slate-200 mb-4">Datos Recientes</h3>
                <div class="overflow-x-auto max-h-48 scrollbar-thin">
                    <table class="w-full text-sm text-left text-slate-400">
                        <thead class="text-xs text-slate-300 uppercase bg-slate-800/50">
                            <tr>
                                <th class="px-4 py-3">Hora</th>
                                <th class="px-4 py-3">Categoría</th>
                                <th class="px-4 py-3">Porcentaje (Valor Bruto)</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('graficaLive').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Intensidad de Sonido (%)',
                    data: [],
                    borderColor: '#22d3ee',
                    backgroundColor: 'rgba(34, 211, 238, 0.03)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 150 }, 
                scales: {
                    y: { min: 0, max: 100, grid: { color: '#1e293b' } },
                    x: { grid: { display: false } }
                }
            }
        });

        const tabla = document.getElementById('tablaCuerpo');
        const estado = document.getElementById('estadoConexion');
        const MAX_PUNTOS = 12; 
        let miWebSocket = null;

        // Carga inicial rápida de los últimos 10 datos guardados en Mongo
        async function preinicializarDashboard() {
            try {
                const res = await fetch('/api/historial/inicial');
                const datos = await res.json();
                
                // Mapear el histórico a la gráfica
                const datosGrafica = [...datos].reverse();
                chart.data.labels = datosGrafica.map(d => d.fecha_hora);
                chart.data.datasets[0].data = datosGrafica.map(d => d.porcentaje);
                chart.update();

                // Mapear el histórico a la tabla
                tabla.innerHTML = datos.map(d => `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                        <td class="px-4 py-3 font-semibold ${
                            d.categoria === 'Ruido Alto' ? 'text-red-400' : 
                            d.categoria === 'Moderado' ? 'text-yellow-400' : 'text-green-400'
                        }">${d.categoria}</td>
                        <td class="px-4 py-3 text-slate-400 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.log("Sincronizando con la base de datos remota...");
            }
            
            // Lanza el enlace de comunicación en tiempo real
            conectarWebSocket();
        }

        // Conexión síncrona por WebSocket Optimizada
        function conectarWebSocket() {
            if (miWebSocket) {
                miWebSocket.close();
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/live`;
            
            miWebSocket = new WebSocket(wsUrl);

            miWebSocket.onopen = () => {
                estado.innerText = "Transmisión RAM en Vivo Activa";
                estado.className = "bg-emerald-500/10 text-emerald-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-emerald-500/20";
            };

            miWebSocket.onmessage = (event) => {
                const d = JSON.parse(event.data);

                // 1. DESPLAZAMIENTO AUTOMÁTICO DE LA GRÁFICA AL RECIBIR MENSAJE
                if (chart.data.labels.length >= MAX_PUNTOS) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                }
                chart.data.labels.push(d.fecha_hora);
                chart.data.datasets[0].data.push(d.porcentaje);
                chart.update();

                // 2. ADICIÓN DINÁMICA DE ELEMENTOS A LA TABLA
                const nuevaFila = `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                        <td class="px-4 py-3 font-semibold ${
                            d.categoria === 'Ruido Alto' ? 'text-red-400' : 
                            d.categoria === 'Moderado' ? 'text-yellow-400' : 'text-green-400'
                        }">${d.categoria}</td>
                        <td class="px-4 py-3 text-slate-400 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
                    </tr>
                `;
                tabla.insertAdjacentHTML('afterbegin', nuevaFila);

                if (tabla.children.length > 15) {
                    tabla.lastElementChild.remove();
                }
            };

            miWebSocket.onclose = () => {
                estado.innerText = "Desconectado - Reconectando...";
                estado.className = "bg-red-500/10 text-red-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-red-500/20";
                // Reconexión cíclica automática cada 3 segundos
                setTimeout(conectarWebSocket, 3000);
            };
        }

        function activarFlujoVivo() {
            document.getElementById('tituloTabla').innerText = "Datos Recientes";
            preinicializarDashboard();
        }

        async function filtrarAlertas() {
            document.getElementById('tituloTabla').innerText = "Historial de Alertas Críticas";
            const res = await fetch('/api/historial/alertas');
            const datos = await res.json();

            tabla.innerHTML = datos.map(d => `
                <tr class="border-b border-slate-800 bg-red-950/10">
                    <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                    <td class="px-4 py-3 text-red-400 font-bold">${d.categoria}</td>
                    <td class="px-4 py-3 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
                </tr>
            `).join('');
        }

        // Arranque global síncrono al abrir ventana
        preinicializarDashboard();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONIDOFlop Panel</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">

    <div class="max-w-5xl mx-auto space-y-6">
        <header class="flex justify-between items-center border-b border-slate-800 pb-4">
            <h1 class="text-3xl font-bold tracking-tight text-cyan-400">
                SONIDO<span class="text-white">Flop</span>
            </h1>
            <span id="estadoConexion"
                class="bg-amber-500/10 text-amber-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-amber-500/20">
                Conectando...
            </span>
        </header>

        <!-- Tarjetas de resumen -->
        <div class="grid grid-cols-3 gap-4">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-500 uppercase tracking-widest mb-1">Último valor</p>
                <p id="cardValor" class="text-3xl font-bold text-cyan-400">—</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-500 uppercase tracking-widest mb-1">Categoría</p>
                <p id="cardCategoria" class="text-2xl font-bold text-slate-300">—</p>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-center">
                <p class="text-xs text-slate-500 uppercase tracking-widest mb-1">Hora</p>
                <p id="cardHora" class="text-2xl font-bold text-slate-300 font-mono">—</p>
            </div>
        </div>

        <!-- Gráfica -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
            <h2 class="text-xl font-semibold mb-4 text-slate-300">
                Detección de ruido en tiempo real
            </h2>
            <div class="h-64">
                <canvas id="graficaLive"></canvas>
            </div>
        </div>

        <!-- Panel inferior -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="md:col-span-1 bg-slate-900 border border-slate-800 rounded-xl p-6 flex flex-col gap-4">
                <h3 class="text-lg font-medium text-slate-200">Panel de Control</h3>
                <p class="text-sm text-slate-400">Gestiona el flujo de datos en tiempo real.</p>
                <button onclick="activarFlujoVivo()"
                    class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-medium py-2 px-4 rounded-lg transition cursor-pointer">
                    Reiniciar Flujo Vivo
                </button>
                <button onclick="filtrarAlertas()"
                    class="w-full bg-red-950 hover:bg-red-900 text-red-200 font-medium py-2 px-4 rounded-lg border border-red-800/50 transition cursor-pointer">
                    Ver Alertas Críticas
                </button>
            </div>

            <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6">
                <h3 id="tituloTabla" class="text-lg font-medium text-slate-200 mb-4">Datos Recientes</h3>
                <div class="overflow-x-auto max-h-48 scrollbar-thin">
                    <table class="w-full text-sm text-left text-slate-400">
                        <thead class="text-xs text-slate-300 uppercase bg-slate-800/50">
                            <tr>
                                <th class="px-4 py-3">Hora</th>
                                <th class="px-4 py-3">Categoría</th>
                                <th class="px-4 py-3">Porcentaje (Valor Bruto)</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ── Gráfica ────────────────────────────────────────────────────────────
        const ctx = document.getElementById('graficaLive').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Intensidad de Sonido (%)',
                    data: [],
                    borderColor: '#22d3ee',
                    backgroundColor: 'rgba(34, 211, 238, 0.06)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.3,
                    pointRadius: 3,
                    pointBackgroundColor: '#22d3ee'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                // ✅ FIX: animación desactivada para que la gráfica no "congele"
                //    al recibir datos rápidos
                animation: false,
                scales: {
                    y: {
                        min: 0,
                        max: 100,
                        grid: { color: '#1e293b' },
                        ticks: { color: '#94a3b8' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#94a3b8', maxRotation: 45 }
                    }
                },
                plugins: {
                    legend: { labels: { color: '#cbd5e1' } }
                }
            }
        });

        // ── Estado global ──────────────────────────────────────────────────────
        const tabla = document.getElementById('tablaCuerpo');
        const estado = document.getElementById('estadoConexion');
        const MAX_PUNTOS = 15;
        let miWebSocket = null;
        let reconectando = false;

        // ── Helpers de color ───────────────────────────────────────────────────
        function colorCategoria(cat) {
            if (cat === 'Ruido Alto') return 'text-red-400';
            if (cat === 'Moderado')   return 'text-yellow-400';
            return 'text-green-400';
        }

        // ── Actualiza las tarjetas de resumen ──────────────────────────────────
        function actualizarTarjetas(d) {
            document.getElementById('cardValor').textContent     = d.porcentaje + '%';
            document.getElementById('cardCategoria').textContent = d.categoria;
            document.getElementById('cardHora').textContent      = d.fecha_hora;

            const colores = {
                'Ruido Alto' : 'text-red-400',
                'Moderado'   : 'text-yellow-400',
                'Silencio'   : 'text-green-400'
            };
            document.getElementById('cardCategoria').className =
                'text-2xl font-bold ' + (colores[d.categoria] || 'text-slate-300');
        }

        // ── Añade un punto a la gráfica ────────────────────────────────────────
        function agregarPuntoGrafica(d) {
            if (chart.data.labels.length >= MAX_PUNTOS) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.data.labels.push(d.fecha_hora);
            chart.data.datasets[0].data.push(d.porcentaje);

            // ✅ FIX: 'none' evita que Chart.js encole animaciones y congele
            chart.update('none');
        }

        // ── Añade fila a la tabla ──────────────────────────────────────────────
        function agregarFilaTabla(d) {
            const fila = document.createElement('tr');
            fila.className = 'border-b border-slate-800 hover:bg-slate-800/40 transition';
            fila.innerHTML = `
                <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                <td class="px-4 py-3 font-semibold ${colorCategoria(d.categoria)}">${d.categoria}</td>
                <td class="px-4 py-3 text-slate-400 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
            `;
            tabla.insertBefore(fila, tabla.firstChild);
            if (tabla.children.length > 15) tabla.lastElementChild.remove();
        }

        // ── Carga historial inicial desde Mongo ────────────────────────────────
        async function preinicializarDashboard() {
            try {
                const res  = await fetch('/api/historial/inicial');
                const datos = await res.json();

                // Gráfica: datos en orden cronológico ascendente
                const asc = [...datos].reverse();
                chart.data.labels                = asc.map(d => d.fecha_hora);
                chart.data.datasets[0].data      = asc.map(d => d.porcentaje);
                chart.update('none');

                // Tabla: el más reciente primero
                tabla.innerHTML = datos.map(d => `
                    <tr class="border-b border-slate-800 hover:bg-slate-800/40 transition">
                        <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                        <td class="px-4 py-3 font-semibold ${colorCategoria(d.categoria)}">${d.categoria}</td>
                        <td class="px-4 py-3 text-slate-400 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.warn('Sin historial inicial:', err);
            }
        }

        // ── WebSocket ──────────────────────────────────────────────────────────
        function conectarWebSocket() {
            // ✅ FIX: evita abrir múltiples conexiones simultáneas
            if (miWebSocket &&
                (miWebSocket.readyState === WebSocket.CONNECTING ||
                 miWebSocket.readyState === WebSocket.OPEN)) {
                return;
            }

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            miWebSocket = new WebSocket(`${protocol}//${location.host}/ws/live`);

            miWebSocket.onopen = () => {
                reconectando = false;
                estado.textContent  = 'Transmisión en Vivo Activa';
                estado.className    =
                    'bg-emerald-500/10 text-emerald-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-emerald-500/20';
                console.log('[WS] Conectado');
            };

            miWebSocket.onmessage = (event) => {
                const d = JSON.parse(event.data);

                // ✅ FIX: ignorar los frames de ping del servidor
                if (d.tipo === 'ping') return;

                actualizarTarjetas(d);
                agregarPuntoGrafica(d);
                agregarFilaTabla(d);
            };

            miWebSocket.onclose = () => {
                estado.textContent  = 'Desconectado — Reconectando...';
                estado.className    =
                    'bg-red-500/10 text-red-400 text-xs font-medium px-2.5 py-0.5 rounded-full border border-red-500/20';

                // ✅ FIX: backoff suave para no spamear reconexiones
                if (!reconectando) {
                    reconectando = true;
                    setTimeout(conectarWebSocket, 3000);
                }
            };

            miWebSocket.onerror = (err) => {
                console.error('[WS] Error:', err);
                miWebSocket.close();
            };
        }

        // ── Botones ────────────────────────────────────────────────────────────
        function activarFlujoVivo() {
            document.getElementById('tituloTabla').textContent = 'Datos Recientes';
            preinicializarDashboard();
            conectarWebSocket();
        }

        async function filtrarAlertas() {
            document.getElementById('tituloTabla').textContent = 'Historial de Alertas Críticas';
            try {
                const res   = await fetch('/api/historial/alertas');
                const datos = await res.json();
                tabla.innerHTML = datos.map(d => `
                    <tr class="border-b border-slate-800 bg-red-950/10">
                        <td class="px-4 py-3 text-slate-300">${d.fecha_hora}</td>
                        <td class="px-4 py-3 text-red-400 font-bold">${d.categoria}</td>
                        <td class="px-4 py-3 font-mono">${d.porcentaje}% (${d.valor_bruto})</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Error cargando alertas:', err);
            }
        }

        // ── Arranque ───────────────────────────────────────────────────────────
        preinicializarDashboard();
        conectarWebSocket();
    </script>
</body>
</html>
